<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MistBean Admin</title><link rel="stylesheet" href="/admin/admin.css"></head>
<body><main class="shell"><header><div><p class="eyebrow">MISTBEAN COFFEE</p><h1>Order desk</h1><p class="muted">Private business operations</p></div><button id="logout" class="secondary" hidden>Sign out</button></header>
<div class="test-warning">TEST MODE · Single-digit test prices and payment integration testing only.</div><section id="loginPanel" class="panel login"><h2>Administrator sign in</h2><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><p id="loginError" class="error" role="alert"></p><button class="primary">Sign in</button></form></section>
<section id="appPanel" hidden><div class="toolbar"><div><h2>Orders</h2><p class="muted">Latest 200 orders</p></div><button id="refresh" class="secondary">Refresh</button></div><div class="filters"><button data-filter="ALL" class="filter active">All</button><button data-filter="PENDING" class="filter">Pending</button><button data-filter="CONFIRMED" class="filter">Confirmed</button><button data-filter="REJECTED" class="filter">Rejected</button><button data-filter="DISPATCHED" class="filter">Dispatched</button><button data-filter="DELIVERED" class="filter">Delivered</button></div><p id="appError" class="error"></p><div id="orders" class="orders"></div></section>
<footer>Do not share this admin URL or password. Enable MFA on the associated business accounts.</footer></main><script src="/admin/admin.js"></script></body></html>
